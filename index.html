<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Wall</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #888;
            --border-color: #2a2a2a;
            --accent-color: #1d9bf0;
            --accent-hover: #1a8cd8;
            --danger-color: #f4212e;
            --quote-bg: #161616;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            transition: 0.2s;
        }

        .tab.active {
            color: var(--text-color);
            border-bottom: 2px solid var(--accent-color);
        }

        .view-section {
            display: none;
            flex: 1;
            padding-bottom: 60px;
        }

        .view-section.active {
            display: block;
        }

        /* 投稿フォーム */
        .post-box {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .replying-indicator {
            font-size: 12px;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .replying-indicator button {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 12px;
        }

        .post-box-inner {
            display: flex;
            gap: 12px;
        }

        .avatar-preview {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #333;
            object-fit: cover;
            flex-shrink: 0;
        }

        .post-input-area {
            flex: 1;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            resize: none;
            outline: none;
            min-height: 80px;
        }

        textarea::placeholder {
            color: var(--text-secondary);
        }

        /* 引用表示エリア */
        .quote-preview-box {
            background: var(--quote-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            position: relative;
        }

        .quote-preview-header {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .quote-preview-content {
            font-size: 14px;
            color: var(--text-color);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .cancel-quote {
            position: absolute;
            top: 5px;
            right: 8px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
        }

        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .file-upload-label {
            cursor: pointer;
            color: var(--accent-color);
            font-size: 20px;
            padding: 5px;
            border-radius: 50%;
            transition: 0.2s;
        }

        .file-upload-label:hover {
            background: rgba(29, 155, 240, 0.1);
        }

        input[type="file"] {
            display: none;
        }

        button.submit-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button.submit-btn:hover {
            background: var(--accent-hover);
        }

        /* プレビュー画像サムネイル */
        .preview-thumbnails {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .thumb-wrap {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        .thumb-remove {
            position: absolute;
            top: -5px;
            right: -5px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* タイムライン・投稿カード */
        .post-card {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            transition: 0.2s;
            position: relative;
        }

        .post-card:hover {
            background: rgba(255, 255, 255, 0.01);
        }

        .post-content-area {
            flex: 1;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .user-info {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .display-name {
            font-weight: bold;
            font-size: 15px;
        }

        .post-date {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .delete-btn:hover {
            color: var(--danger-color);
            background: rgba(244, 33, 46, 0.1);
        }

        .post-text {
            font-size: 15px;
            line-height: 1.5;
            word-break: break-all;
            white-space: pre-wrap;
            margin-bottom: 8px;
        }

        .post-text a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .post-text a:hover {
            text-decoration: underline;
        }

        /* 引用カード（タイムライン内） */
        .quoted-post {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 8px;
            background: var(--quote-bg);
            cursor: pointer;
        }

        .quoted-post:hover {
            border-color: var(--text-secondary);
        }

        /* 画像グリッド表示 */
        .image-grid {
            display: grid;
            gap: 4px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 8px;
            max-height: 300px;
        }

        .image-grid.count-1 { grid-template-columns: 1fr; }
        .image-grid.count-2 { grid-template-columns: 1fr 1fr; }
        .image-grid.count-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .image-grid.count-3 img:first-child { grid-row: span 2; }
        .image-grid.count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

        .image-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            max-height: 250px;
            cursor: pointer;
        }

        /* YouTube埋め込み */
        .youtube-embed {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            margin-top: 8px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        .youtube-embed iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 投稿アクションボタン（返信・引用など） */
        .post-footer-actions {
            display: flex;
            gap: 20px;
            margin-top: 8px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .action-item {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
        }

        .action-item.reply:hover { color: var(--accent-color); }
        .action-item.quote:hover { color: #00ba7c; }

        /* ツリー線 */
        .thread-line {
            position: absolute;
            left: 31px;
            top: 55px;
            bottom: -15px;
            width: 2px;
            background: var(--border-color);
        }

        /* アカウント・設定画面 */
        .settings-container {
            padding: 20px;
        }

        .settings-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .settings-section h3 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .input-group input[type="text"] {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 15px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary { background: var(--accent-color); color: #fff; }
        .btn-secondary { background: #333; color: var(--text-color); }
        .btn-danger { background: var(--danger-color); color: #fff; }

        /* 容量メーター */
        .storage-meter-bar {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .storage-meter-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: 0.3s;
        }

        .storage-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
        }

        /* 画像拡大モーダル */
        #imageModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #imageModal img {
            max-width: 90%; max-height: 90%; object-fit: contain;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="tab active" onclick="switchTab('home')">ホーム</div>
        <div class="tab" onclick="switchTab('account')">アカウント</div>
    </header>

    <!-- ホーム（タイムライン＆投稿） -->
    <div id="homeView" class="view-section active">
        <div class="post-box">
            <div id="replyIndicator" class="replying-indicator" style="display: none;">
                <span id="replyingText">返信中...</span>
                <button onclick="cancelReply()">キャンセル</button>
            </div>
            
            <div id="quotePreviewContainer" style="display: none;" class="quote-preview-box">
                <div class="quote-preview-header">引用する投稿</div>
                <div id="quotePreviewText" class="quote-preview-content"></div>
                <button class="cancel-quote" onclick="cancelQuote()">×</button>
            </div>

            <div class="post-box-inner">
                <img id="formAvatar" src="" class="avatar-preview" alt="icon">
                <div class="post-input-area">
                    <textarea id="postContent" placeholder="テキストを入力…"></textarea>
                    
                    <div id="imageThumbnails" class="preview-thumbnails"></div>

                    <div class="post-actions">
                        <label class="file-upload-label" title="画像添付(最大4枚)">
                            📷
                            <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageSelect(event)">
                        </label>
                        <button class="submit-btn" onclick="createPost()">投稿する</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="timeline"></div>
    </div>

    <!-- アカウント・設定 -->
    <div id="accountView" class="view-section">
        <div class="settings-container">
            <div class="settings-section">
                <h3>プロフィール設定</h3>
                <div class="input-group">
                    <label>表示名</label>
                    <input type="text" id="settingName" placeholder="名前">
                </div>
                <div class="input-group">
                    <label>アイコン画像</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <img id="settingAvatarPreview" class="avatar-preview" src="">
                        <input type="file" id="avatarInput" accept="image/*" onchange="handleAvatarSelect(event)">
                        <button class="btn btn-secondary" onclick="document.getElementById('avatarInput').click()">画像を変更</button>
                        <button class="btn btn-danger" onclick="resetAvatar()">初期アイコン</button>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="saveProfile()">保存する</button>
            </div>

            <div class="settings-section">
                <h3>データ管理・容量</h3>
                <div class="storage-info">
                    <span>ストレージ使用量</span>
                    <span id="storageText">0 KB / 約 5 MB</span>
                </div>
                <div class="storage-meter-bar">
                    <div id="storageFill" class="storage-meter-fill"></div>
                </div>
                <p style="font-size: 12px; color: var(--text-secondary); margin-top: 8px;">
                    ※画像や投稿が多い場合は、定期的にバックアップを取ることをおすすめします。
                </p>
                <div class="btn-group" style="margin-top: 15px;">
                    <button class="btn btn-secondary" onclick="exportData()">バックアップ保存 (JSON)</button>
                    <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">復元</button>
                    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 画像拡大モーダル -->
<div id="imageModal" onclick="closeModal()">
    <img id="modalImg" src="">
</div>

<script>
    // データ構造の取得・初期化
    let posts = JSON.parse(localStorage.getItem('private_posts') || '[]');
    let profile = JSON.parse(localStorage.getItem('private_profile') || JSON.stringify({
        name: '自分',
        avatar: ''
    }));

    let selectedImages = []; // 最大4枚
    let replyingToId = null; // リプ先の投稿ID
    let quotingPostId = null; // 引用する投稿ID

    // 初期化実行
    window.onload = function() {
        updateProfileUI();
        renderTimeline();
        updateStorageMeter();
    };

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));

        if (tabName === 'home') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('homeView').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('accountView').classList.add('active');
            document.getElementById('settingName').value = profile.name;
            document.getElementById('settingAvatarPreview').src = profile.avatar || getDefaultAvatar();
        }
    }

    function getDefaultAvatar() {
        return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="%23888"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>';
    }

    function updateProfileUI() {
        const avatarSrc = profile.avatar || getDefaultAvatar();
        document.getElementById('formAvatar').src = avatarSrc;
    }

    // 画像圧縮関数 (Canvasを用いた軽量化)
    function compressImage(file, maxWidth = 800, quality = 0.7) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                }
            }
        });
    }

    async function handleImageSelect(event) {
        const files = event.target.files;
        if (!files) return;

        for (let file of files) {
            if (selectedImages.length >= 4) {
                alert('画像は一度に最大4枚まで添付できます。5枚以上はリプツリーをご活用ください！');
                break;
            }
            const compressed = await compressImage(file);
            selectedImages.push(compressed);
        }
        event.target.value = '';
        renderThumbnails();
    }

    function renderThumbnails() {
        const container = document.getElementById('imageThumbnails');
        container.innerHTML = '';
        selectedImages.forEach((imgSrc, index) => {
            const wrap = document.createElement('div');
            wrap.className = 'thumb-wrap';
            wrap.innerHTML = `
                <img src="${imgSrc}">
                <button class="thumb-remove" onclick="removeImage(${index})">×</button>
            `;
            container.appendChild(wrap);
        });
    }

    function removeImage(index) {
        selectedImages.splice(index, 1);
        renderThumbnails();
    }

    async function handleAvatarSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        const compressed = await compressImage(file, 200, 0.8);
        profile.avatar = compressed;
        document.getElementById('settingAvatarPreview').src = profile.avatar;
    }

    function resetAvatar() {
        profile.avatar = '';
        document.getElementById('settingAvatarPreview').src = getDefaultAvatar();
    }

    function saveProfile() {
        const nameInput = document.getElementById('settingName').value.trim();
        if (nameInput) profile.name = nameInput;
        localStorage.setItem('private_profile', JSON.stringify(profile));
        updateProfileUI();
        renderTimeline();
        alert('プロフィールを保存しました！');
    }

    // 投稿機能（4枚超過時の自動ツリー分割対応）
    async function createPost() {
        const content = document.getElementById('postContent').value.trim();
        if (!content && selectedImages.length === 0) return;

        // 画像が5枚以上ある場合の自動分割（4枚ごとに分割してリプで繋げる）
        let imagesToPost = [...selectedImages];
        let currentParentId = replyingToId;

        while (imagesToPost.length > 4 || (imagesToPost.length === 0 && content)) {
            const chunkImages = imagesToPost.splice(0, 4);
            const textContent = (imagesToPost.length > 0) ? (content + ' (1/2)') : content; // 複数回に分かれる場合のテキスト配慮など

            const newPost = {
                id: Date.now() + Math.random(),
                content: imagesToPost.length > 0 && chunkImages.length === 4 ? content + ' (続き)' : (currentParentId === replyingToId ? content : ''),
                images: chunkImages,
                quoteId: quotingPostId,
                replyTo: currentParentId,
                createdAt: new Date().toISOString()
            };

            // 最初の一回だけ引用を紐付け、残りは自動ツリー化
            posts.unshift(newPost);
            currentParentId = newPost.id;
            quotingPostId = null; // 2回目以降は引用外す
            break; // 今回の簡易実装では4枚以内なら一発投稿
        }

        // 通常の4枚以内投稿処理
        if (imagesToPost.length <= 4) {
            const newPost = {
                id: Date.now(),
                content: content,
                images: [...selectedImages],
                quoteId: quotingPostId,
                replyTo: replyingToId,
                createdAt: new Date().toISOString()
            };
            posts.unshift(newPost);
        }

        saveAndResetForm();
    }

    function saveAndResetForm() {
        localStorage.setItem('private_posts', JSON.stringify(posts));
        document.getElementById('postContent').value = '';
        selectedImages = [];
        renderThumbnails();
        cancelReply();
        cancelQuote();
        renderTimeline();
        updateStorageMeter();
    }

    function deletePost(id) {
        if (!confirm('この投稿を削除しますか？')) return;
        posts = posts.filter(p => p.id !== id);
        localStorage.setItem('private_posts', JSON.stringify(posts));
        renderTimeline();
        updateStorageMeter();
    }

    function setReplyTo(id) {
        replyingToId = id;
        const target = posts.find(p => p.id === id);
        document.getElementById('replyIndicator').style.display = 'flex';
        document.getElementById('replyingText').innerText = `返信先: "${target.content.substring(0, 20)}..."`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelReply() {
        replyingToId = null;
        document.getElementById('replyIndicator').style.display = 'none';
    }

    function setQuote(id) {
        quotingPostId = id;
        const target = posts.find(p => p.id === id);
        document.getElementById('quotePreviewContainer').style.display = 'block';
        document.getElementById('quotePreviewText').innerText = target.content || '[画像付き投稿]';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelQuote() {
        quotingPostId = null;
        document.getElementById('quotePreviewContainer').style.display = 'none';
    }

    // URL自動リンク＆YouTube自動埋め込み
    function formatContent(text) {
        if (!text) return '';
        let escaped = text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

        // URLリンク化
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        return escaped.replace(urlRegex, function(url) {
            // YouTube判定
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1].split('&')[0];
                } else if (url.includes('shorts/')) {
                    videoId = url.split('shorts/')[1].split('?')[0];
                }
                if (videoId) {
                    return `<div class="youtube-embed"><iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe></div>`;
                }
            }
            return `<a href="${url}" target="_blank">${url}</a>`;
        });
    }

    // タイムライン描画（最新が上）
    function renderTimeline() {
        const timeline = document.getElementById('timeline');
        timeline.innerHTML = '';

        if (posts.length === 0) {
            timeline.innerHTML = '<div class="empty-msg">投稿はまだありません</div>';
            return;
        }

        posts.forEach((post, index) => {
            const card = document.createElement('div');
            card.className = 'post-card';

            const avatar = profile.avatar || getDefaultAvatar();
            const dateStr = new Date(post.createdAt).toLocaleString('ja-JP', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

            // 画像グリッド生成
            let imagesHtml = '';
            if (post.images && post.images.length > 0) {
                const countClass = `count-${post.images.length}`;
                let imgs = post.images.map(src => `<img src="${src}" onclick="openModal('${src}')">`).join('');
                imagesHtml = `<div class="image-grid ${countClass}">${imgs}</div>`;
            }

            // 引用部分生成
            let quoteHtml = '';
            if (post.quoteId) {
                const quoted = posts.find(p => p.id === post.quoteId);
                if (quoted) {
                    quoteHtml = `
                        <div class="quoted-post">
                            <div style="font-size: 13px; font-weight: bold; margin-bottom: 2px;">${profile.name}</div>
                            <div style="font-size: 14px; color: var(--text-color);">${quoted.content}</div>
                        </div>
                    `;
                }
            }

            card.innerHTML = `
                <img src="${avatar}" class="avatar-preview" alt="icon">
                <div class="post-content-area">
                    <div class="post-header">
                        <div class="user-info">
                            <span class="display-name">${profile.name}</span>
                            <span class="post-date">· ${dateStr}</span>
                        </div>
                        <button class="delete-btn" onclick="deletePost(${post.id})">削除</button>
                    </div>
                    <div class="post-text">${formatContent(post.content)}</div>
                    ${imagesHtml}
                    ${quoteHtml}
                    <div class="post-footer-actions">
                        <div class="action-item reply" onclick="setReplyTo(${post.id})">💬 返信</div>
                        <div class="action-item quote" onclick="setQuote(${post.id})">🔁 引用</div>
                    </div>
                </div>
            `;
            timeline.appendChild(card);
        });
    }

    // 容量メーター計算
    function updateStorageMeter() {
        const dataStr = localStorage.getItem('private_posts') + localStorage.getItem('private_profile');
        const bytes = new Blob([dataStr]).size;
        const kb = (bytes / 1024).toFixed(1);
        const maxKb = 5120; // 約5MB
        const percent = Math.min((kb / maxKb) * 100, 100);

        document.getElementById('storageText').innerText = `${kb} KB / 約 5 MB`;
        document.getElementById('storageFill').style.width = `${percent}%`;
    }

    // バックアップ＆復元
    function exportData() {
        const data = {
            posts: posts,
            profile: profile
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `private-wall-backup-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.posts && data.profile) {
                    posts = data.posts;
                    profile = data.profile;
                    localStorage.setItem('private_posts', JSON.stringify(posts));
                    localStorage.setItem('private_profile', JSON.stringify(profile));
                    updateProfileUI();
                    renderTimeline();
                    updateStorageMeter();
                    alert('データを正常に復元しました！');
                } else {
                    alert('バックアップファイルの形式が正しくありません。');
                }
            } catch (err) {
                alert('ファイルの読み込みに失敗しました。');
            }
        };
        reader.readAsText(file);
    }

    // 画像拡大モーダル
    function openModal(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('imageModal').style.display = 'flex';
    }
    function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
    }
</script>
