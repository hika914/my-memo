<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひとりごと帳 - プライベート壁打ち</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            canvas: '#f8f9fa',
            surface: '#ffffff',
            borderSubtle: '#e5e7eb',
            inkPrimary: '#1f2937',
            inkSecondary: '#6b7280',
            accent: '#374151',
            accentHover: '#111827',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f8f9fa;
      color: #1f2937;
      -webkit-font-smoothing: antialiased;
    }
    /* スクロールバーの微調整 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #9ca3af;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-gray-200 selection:text-gray-900">

  <!-- ヘッダーナビゲーション -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-gray-200">
    <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 text-gray-800 font-semibold tracking-tight">
        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
        <span class="text-sm sm:text-base">ひとりごと帳</span>
      </div>

      <!-- タブ切り替え -->
      <nav class="flex items-center gap-1 bg-gray-100 p-1 rounded-xl" role="tablist">
        <button id="tab-home" onclick="switchTab('home')" role="tab" aria-selected="true"
          class="px-4 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all duration-150 bg-white text-gray-900 shadow-sm">
          ホーム
        </button>
        <button id="tab-account" onclick="switchTab('account')" role="tab" aria-selected="false"
          class="px-4 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all duration-150 text-gray-600 hover:text-gray-900">
          アカウント
        </button>
      </nav>
    </div>
  </header>

  <!-- メインコンテンツエリア -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-6">

    <!-- ==================== ホームビュー ==================== -->
    <section id="view-home" class="space-y-6">
      <!-- 投稿作成フォーム -->
      <div class="bg-white rounded-2xl border border-gray-200 p-4 shadow-sm">
        <textarea id="post-input" rows="3"
          placeholder="テキストを入力…"
          class="w-full resize-none border-0 focus:ring-0 focus:outline-none text-gray-800 placeholder-gray-400 text-sm sm:text-base leading-relaxed"></textarea>

        <!-- 画像プレビューエリア（添付時のみ表示） -->
        <div id="image-preview-container" class="hidden relative mt-3 inline-block">
          <img id="image-preview" src="" alt="添付プレビュー" class="max-h-60 rounded-xl border border-gray-200 object-contain bg-gray-50">
          <button type="button" onclick="removeAttachedImage()" title="画像を削除"
            class="absolute top-2 right-2 bg-gray-900/75 hover:bg-gray-900 text-white rounded-full p-1.5 transition-colors shadow">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <!-- アクションバー -->
        <div class="mt-3 pt-3 border-t border-gray-100 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <!-- 画像選択ボタン -->
            <label for="image-upload" class="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-colors">
              <svg class="w-4 h-4 sm:w-5 sm:h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
              <span>画像添付</span>
            </label>
            <input id="image-upload" type="file" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
            <span class="hidden sm:inline text-xs text-gray-400">Ctrl + Enter で投稿</span>
          </div>

          <button type="button" onclick="createPost()" id="submit-post-btn"
            class="px-5 py-2 bg-gray-800 hover:bg-gray-900 active:scale-[0.99] text-white text-xs sm:text-sm font-medium rounded-xl transition-all shadow-sm">
            投稿する
          </button>
        </div>
      </div>

      <!-- タイムライン一覧 -->
      <div class="space-y-3" id="home-timeline">
        <!-- JavaScriptで動的に投稿カードが挿入されます -->
      </div>
    </section>

    <!-- ==================== アカウントビュー ==================== -->
    <section id="view-account" class="hidden space-y-6">
      <!-- プロフィールカード -->
      <div class="bg-white rounded-2xl border border-gray-200 p-5 sm:p-6 shadow-sm">
        <div class="flex items-start justify-between gap-4">
          <div class="flex items-center gap-3.5">
            <!-- シンプルなアバターアイコン -->
            <div class="w-14 h-14 rounded-2xl bg-gray-100 border border-gray-200 flex items-center justify-center text-gray-600 shrink-0">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </div>
            <div>
              <h2 id="profile-display-name" class="text-base sm:text-lg font-semibold text-gray-900">管理人</h2>
              <p id="profile-display-handle" class="text-xs sm:text-sm text-gray-500">@private_wall</p>
            </div>
          </div>

          <button type="button" onclick="toggleProfileEdit()" id="edit-profile-btn"
            class="px-3.5 py-1.5 text-xs sm:text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-xl transition-colors">
            プロフィール編集
          </button>
        </div>

        <p id="profile-display-bio" class="mt-4 text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">誰にも見られない自分だけの思考・創作の記録スペース。</p>

        <!-- プロフィール編集フォーム（初期状態は非表示） -->
        <div id="profile-edit-form" class="hidden mt-4 pt-4 border-t border-gray-100 space-y-3">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">表示名</label>
            <input type="text" id="input-profile-name" maxlength="30"
              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-xl focus:outline-none focus:border-gray-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">ID / ハンドル</label>
            <input type="text" id="input-profile-handle" maxlength="30"
              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-xl focus:outline-none focus:border-gray-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">メモ / 自己紹介</label>
            <textarea id="input-profile-bio" rows="2" maxlength="200"
              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-xl focus:outline-none focus:border-gray-500 resize-none"></textarea>
          </div>
          <div class="flex justify-end gap-2 pt-1">
            <button type="button" onclick="toggleProfileEdit()"
              class="px-3.5 py-1.5 text-xs sm:text-sm text-gray-600 hover:bg-gray-100 rounded-xl">キャンセル</button>
            <button type="button" onclick="saveProfile()"
              class="px-4 py-1.5 text-xs sm:text-sm bg-gray-800 hover:bg-gray-900 text-white font-medium rounded-xl">保存する</button>
          </div>
        </div>

        <!-- ステータスとバックアップ操作 -->
        <div class="mt-5 pt-4 border-t border-gray-100 flex flex-wrap items-center justify-between gap-3">
          <div class="text-xs sm:text-sm text-gray-600">
            総投稿数: <span id="total-posts-count" class="font-semibold text-gray-900">0</span> 件
          </div>

          <div class="flex items-center gap-2">
            <button type="button" onclick="exportBackup()"
              class="inline-flex items-center gap-1 px-3 py-1.5 text-xs text-gray-600 hover:text-gray-900 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-xl transition-colors">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
              </svg>
              バックアップ保存
            </button>
            <label for="import-backup-input"
              class="cursor-pointer inline-flex items-center gap-1 px-3 py-1.5 text-xs text-gray-600 hover:text-gray-900 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-xl transition-colors">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
              </svg>
              データ復元
            </label>
            <input id="import-backup-input" type="file" accept=".json" class="hidden" onchange="importBackup(event)">
          </div>
        </div>
      </div>

      <!-- アーカイブフィルタータブ -->
      <div class="flex items-center gap-2 border-b border-gray-200 pb-2">
        <button id="filter-all" onclick="setAccountFilter('all')"
          class="px-3.5 py-1.5 text-xs sm:text-sm font-medium rounded-xl bg-gray-800 text-white transition-colors">
          すべての投稿
        </button>
        <button id="filter-media" onclick="setAccountFilter('media')"
          class="px-3.5 py-1.5 text-xs sm:text-sm font-medium rounded-xl text-gray-600 hover:bg-gray-200/70 transition-colors">
          メディア付き
        </button>
      </div>

      <!-- アカウント全投稿一覧 -->
      <div class="space-y-3" id="account-timeline">
        <!-- JavaScriptで動的に投稿カードが挿入されます -->
      </div>
    </section>

  </main>

  <!-- 画像拡大モーダル -->
  <div id="image-modal" onclick="closeImageModal()"
    class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="relative max-w-4xl max-h-[90vh] flex items-center justify-center" onclick="event.stopPropagation()">
      <img id="modal-image" src="" alt="拡大画像" class="max-w-full max-h-[85vh] rounded-xl object-contain shadow-2xl">
      <button type="button" onclick="closeImageModal()"
        class="absolute -top-3 -right-3 bg-white text-gray-800 hover:bg-gray-100 rounded-full p-2 shadow-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 削除確認カスタムモーダル（alert/confirmの代わり） -->
  <div id="delete-modal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-gray-200 max-w-sm w-full p-5 shadow-xl space-y-4">
      <h3 class="text-base font-semibold text-gray-900">投稿を削除しますか？</h3>
      <p class="text-sm text-gray-600 leading-relaxed">この操作は取り消せません。本当にこの投稿を削除してもよろしいですか？</p>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="closeDeleteModal()"
          class="px-4 py-2 text-xs sm:text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-xl transition-colors">
          キャンセル
        </button>
        <button type="button" id="confirm-delete-btn"
          class="px-4 py-2 text-xs sm:text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-xl transition-colors">
          削除する
        </button>
      </div>
    </div>
  </div>

  <!-- トースト通知（メッセージ表示用） -->
  <div id="toast"
    class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-200 bg-gray-900 text-white text-xs sm:text-sm px-4 py-2.5 rounded-xl shadow-lg">
  </div>

  <script>
    // ==================== 状態管理 & 定数 ====================
    const STORAGE_KEYS = {
      POSTS: 'private_wall_posts_v1',
      PROFILE: 'private_wall_profile_v1'
    };

    let posts = [];
    let profile = {
      name: '管理人',
      handle: '@private_wall',
      bio: '誰にも見られない自分だけの思考・創作の記録スペース。'
    };

    let attachedImageBase64 = null;
    let currentTab = 'home';
    let accountFilter = 'all'; // 'all' または 'media'
    let pendingDeletePostId = null;

    // ==================== 初期化処理 ====================
    window.addEventListener('DOMContentLoaded', () => {
      loadDataFromStorage();
      renderProfile();
      renderAllViews();

      // Ctrl+Enter / Cmd+Enter で投稿するショートカット
      const postInput = document.getElementById('post-input');
      postInput.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          createPost();
        }
      });

      // 削除確認ボタンのイベント登録
      document.getElementById('confirm-delete-btn').addEventListener('click', () => {
        if (pendingDeletePostId) {
          executeDeletePost(pendingDeletePostId);
          closeDeleteModal();
        }
      });
    });

    // LocalStorageからデータを読み込む
    function loadDataFromStorage() {
      try {
        const savedPosts = localStorage.getItem(STORAGE_KEYS.POSTS);
        if (savedPosts) {
          posts = JSON.parse(savedPosts);
        }
        const savedProfile = localStorage.getItem(STORAGE_KEYS.PROFILE);
        if (savedProfile) {
          profile = { ...profile, ...JSON.parse(savedProfile) };
        }
      } catch (err) {
        console.error('データの読み込みに失敗しました:', err);
        showToast('データの読み込み中にエラーが発生しました');
      }
    }

    // LocalStorageへ投稿データを保存する
    function savePostsToStorage() {
      try {
        localStorage.setItem(STORAGE_KEYS.POSTS, JSON.stringify(posts));
        return true;
      } catch (err) {
        console.error('保存エラー:', err);
        showToast('保存容量の上限に達しました。古い画像付き投稿を削除するかバックアップしてください。');
        return false;
      }
    }

    // ==================== タブ・フィルター切り替え ====================
    function switchTab(tabName) {
      currentTab = tabName;
      const homeView = document.getElementById('view-home');
      const accountView = document.getElementById('view-account');
      const tabHomeBtn = document.getElementById('tab-home');
      const tabAccountBtn = document.getElementById('tab-account');

      if (tabName === 'home') {
        homeView.classList.remove('hidden');
        accountView.classList.add('hidden');
        tabHomeBtn.className = 'px-4 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all duration-150 bg-white text-gray-900 shadow-sm';
        tabAccountBtn.className = 'px-4 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all duration-150 text-gray-600 hover:text-gray-900';
      } else {
        homeView.classList.add('hidden');
        accountView.classList.remove('hidden');
        tabAccountBtn.className = 'px-4 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all duration-150 bg-white text-gray-900 shadow-sm';
        tabHomeBtn.className = 'px-4 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-all duration-150 text-gray-600 hover:text-gray-900';
      }
      renderAllViews();
    }

    function setAccountFilter(filterType) {
      accountFilter = filterType;
      const btnAll = document.getElementById('filter-all');
      const btnMedia = document.getElementById('filter-media');

      if (filterType === 'all') {
        btnAll.className = 'px-3.5 py-1.5 text-xs sm:text-sm font-medium rounded-xl bg-gray-800 text-white transition-colors';
        btnMedia.className = 'px-3.5 py-1.5 text-xs sm:text-sm font-medium rounded-xl text-gray-600 hover:bg-gray-200/70 transition-colors';
      } else {
        btnMedia.className = 'px-3.5 py-1.5 text-xs sm:text-sm font-medium rounded-xl bg-gray-800 text-white transition-colors';
        btnAll.className = 'px-3.5 py-1.5 text-xs sm:text-sm font-medium rounded-xl text-gray-600 hover:bg-gray-200/70 transition-colors';
      }
      renderAccountTimeline();
    }

    // ==================== 画像選択・クライアント側自動圧縮 ====================
    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showToast('画像ファイルを選択してください');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // Canvasを使って最大1000pxにリサイズ＆JPEG品質0.75で軽量化
          const MAX_SIZE = 1000;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_SIZE) {
              height = Math.round((height * MAX_SIZE) / width);
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width = Math.round((width * MAX_SIZE) / height);
              height = MAX_SIZE;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // 圧縮後のDataURLを取得
          attachedImageBase64 = canvas.toDataURL('image/jpeg', 0.75);

          // プレビュー表示
          document.getElementById('image-preview').src = attachedImageBase64;
          document.getElementById('image-preview-container').classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeAttachedImage() {
      attachedImageBase64 = null;
      document.getElementById('image-upload').value = '';
      document.getElementById('image-preview').src = '';
      document.getElementById('image-preview-container').classList.add('hidden');
    }

    // ==================== 投稿の作成・削除 ====================
    function createPost() {
      const inputEl = document.getElementById('post-input');
      const text = inputEl.value.trim();

      if (!text && !attachedImageBase64) {
        showToast('文章を入力するか、画像を添付してください');
        return;
      }

      const now = new Date();
      const newPost = {
        id: Date.now().toString() + '_' + Math.random().toString(36).substring(2, 7),
        text: text,
        image: attachedImageBase64,
        timestamp: formatTimestamp(now),
        createdAt: now.getTime()
      };

      // 新しい投稿を配列の先頭（最新が上）に追加
      posts.unshift(newPost);

      if (savePostsToStorage()) {
        inputEl.value = '';
        removeAttachedImage();
        renderAllViews();
        showToast('投稿しました');
      } else {
        // 保存に失敗した場合は配列から戻す
        posts.shift();
      }
    }

    function requestDeletePost(postId) {
      pendingDeletePostId = postId;
      document.getElementById('delete-modal').classList.remove('hidden');
    }

    function closeDeleteModal() {
      pendingDeletePostId = null;
      document.getElementById('delete-modal').classList.add('hidden');
    }

    function executeDeletePost(postId) {
      posts = posts.filter(p => p.id !== postId);
      savePostsToStorage();
      renderAllViews();
      showToast('投稿を削除しました');
    }

    // ==================== 画面描画（タイムライン生成） ====================
    function renderAllViews() {
      renderHomeTimeline();
      renderAccountTimeline();
      document.getElementById('total-posts-count').textContent = posts.length;
    }

    function renderHomeTimeline() {
      const container = document.getElementById('home-timeline');
      if (posts.length === 0) {
        container.innerHTML = createEmptyStateHTML('投稿はまだありません');
        return;
      }
      container.innerHTML = posts.map(post => createPostCardHTML(post)).join('');
    }

    function renderAccountTimeline() {
      const container = document.getElementById('account-timeline');
      const filteredPosts = accountFilter === 'media'
        ? posts.filter(p => Boolean(p.image))
        : posts;

      if (filteredPosts.length === 0) {
        const msg = accountFilter === 'media'
          ? '画像付きの投稿はまだありません'
          : '投稿はまだありません';
        container.innerHTML = createEmptyStateHTML(msg);
        return;
      }
      container.innerHTML = filteredPosts.map(post => createPostCardHTML(post)).join('');
    }

    function createEmptyStateHTML(message) {
      return `
        <div class="bg-white rounded-2xl border border-gray-200/80 p-10 text-center">
          <p class="text-sm text-gray-400">${escapeHTML(message)}</p>
        </div>
      `;
    }

    // YouTubeのURLから動画IDを抽出する関数（通常動画・短縮URL・Shorts・埋め込みに対応）
    function extractYouTubeVideoIds(text) {
      if (!text) return [];
      const regex = /(?:https?:\/\/)?(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})(?:[?&S#][^\s<]*)?/g;
      const ids = [];
      let match;
      while ((match = regex.exec(text)) !== null) {
        if (match[1] && !ids.includes(match[1])) {
          ids.push(match[1]);
        }
      }
      return ids;
    }

    // テキスト内のHTMLエスケープを行いつつ、URLを自動リンク（色付き）に変換する関数
    function formatPostTextWithLinks(text) {
      if (!text) return '';
      const urlRegex = /(https?:\/\/[^\s<>"']+)/g;
      const parts = text.split(urlRegex);

      return parts.map((part, index) => {
        // splitにキャプチャグループを使うと奇数インデックスがURLになる
        if (index % 2 === 1) {
          const safeUrl = escapeHTML(part);
          return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer" class="text-[#1d9bf0] hover:text-[#1a8cd8] hover:underline break-all transition-colors">${safeUrl}</a>`;
        }
        return escapeHTML(part);
      }).join('');
    }

    function createPostCardHTML(post) {
      const safeName = escapeHTML(profile.name);
      const safeHandle = escapeHTML(profile.handle);
      const formattedText = post.text ? formatPostTextWithLinks(post.text) : '';
      const safeTime = escapeHTML(post.timestamp);
      const youtubeIds = extractYouTubeVideoIds(post.text);

      const imageBlock = post.image ? `
        <div class="mt-3">
          <img src="${post.image}" alt="添付画像" onclick="openImageModal('${post.image}')"
            class="max-h-80 w-auto rounded-xl border border-gray-200 object-contain cursor-zoom-in hover:opacity-95 transition-opacity bg-gray-50">
        </div>
      ` : '';

      const youtubeBlock = youtubeIds.length > 0 ? `
        <div class="mt-3 space-y-2.5">
          ${youtubeIds.map(videoId => `
            <div class="relative w-full overflow-hidden rounded-xl border border-gray-200 bg-black aspect-video shadow-2xs">
              <iframe
                src="https://www.youtube-nocookie.com/embed/${escapeHTML(videoId)}"
                title="YouTube video player"
                class="absolute inset-0 w-full h-full border-0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
                loading="lazy">
              </iframe>
            </div>
          `).join('')}
        </div>
      ` : '';

      const textBlock = formattedText ? `
        <div class="mt-2 text-sm sm:text-base text-gray-800 whitespace-pre-wrap break-words leading-relaxed">${formattedText}</div>
      ` : '';

      return `
        <article class="bg-white rounded-2xl border border-gray-200 p-4 sm:p-5 shadow-2xs transition-colors hover:border-gray-300">
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-9 h-9 rounded-xl bg-gray-100 border border-gray-200 flex items-center justify-center text-gray-500 shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </div>
              <div class="min-w-0">
                <div class="flex items-baseline gap-1.5 flex-wrap">
                  <span class="text-sm font-semibold text-gray-900 truncate">${safeName}</span>
                  <span class="text-xs text-gray-400 truncate">${safeHandle}</span>
                </div>
                <time class="block text-[11px] text-gray-400 mt-0.5">${safeTime}</time>
              </div>
            </div>

            <!-- 削除ボタン -->
            <button type="button" onclick="requestDeletePost('${post.id}')" title="投稿を削除"
              class="text-xs text-gray-400 hover:text-red-600 px-2 py-1 rounded-lg hover:bg-red-50 transition-colors shrink-0">
              削除
            </button>
          </div>

          <div class="pl-0 sm:pl-11">
            ${textBlock}
            ${youtubeBlock}
            ${imageBlock}
          </div>
        </article>
      `;
    }

    // ==================== プロフィール編集機能 ====================
    function renderProfile() {
      document.getElementById('profile-display-name').textContent = profile.name;
      document.getElementById('profile-display-handle').textContent = profile.handle;
      document.getElementById('profile-display-bio').textContent = profile.bio;
    }

    function toggleProfileEdit() {
      const form = document.getElementById('profile-edit-form');
      const isHidden = form.classList.contains('hidden');

      if (isHidden) {
        document.getElementById('input-profile-name').value = profile.name;
        document.getElementById('input-profile-handle').value = profile.handle;
        document.getElementById('input-profile-bio').value = profile.bio;
        form.classList.remove('hidden');
      } else {
        form.classList.add('hidden');
      }
    }

    function saveProfile() {
      const newName = document.getElementById('input-profile-name').value.trim() || '管理人';
      const newHandle = document.getElementById('input-profile-handle').value.trim() || '@private_wall';
      const newBio = document.getElementById('input-profile-bio').value.trim();

      profile = {
        name: newName,
        handle: newHandle.startsWith('@') ? newHandle : '@' + newHandle,
        bio: newBio
      };

      try {
        localStorage.setItem(STORAGE_KEYS.PROFILE, JSON.stringify(profile));
        renderProfile();
        renderAllViews();
        toggleProfileEdit();
        showToast('プロフィールを更新しました');
      } catch (err) {
        showToast('プロフィールの保存に失敗しました');
      }
    }

    // ==================== バックアップ・復元機能 ====================
    function exportBackup() {
      const backupData = {
        exportedAt: new Date().toISOString(),
        profile: profile,
        posts: posts
      };
      const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      a.href = url;
      a.download = `hitorigoto_backup_${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('バックアップファイルを保存しました');
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed.posts)) {
            posts = parsed.posts;
            if (parsed.profile) {
              profile = { ...profile, ...parsed.profile };
              localStorage.setItem(STORAGE_KEYS.PROFILE, JSON.stringify(profile));
            }
            savePostsToStorage();
            renderProfile();
            renderAllViews();
            showToast(`${posts.length}件の投稿データを復元しました`);
          } else {
            showToast('無効なバックアップファイル形式です');
          }
        } catch (err) {
          showToast('ファイルの読み込みに失敗しました');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    // ==================== ユーティリティ関数 ====================
    function openImageModal(src) {
      document.getElementById('modal-image').src = src;
      document.getElementById('image-modal').classList.remove('hidden');
    }

    function closeImageModal() {
      document.getElementById('image-modal').classList.add('hidden');
      document.getElementById('modal-image').src = '';
    }

    function formatTimestamp(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const hh = String(date.getHours()).padStart(2, '0');
      const mm = String(date.getMinutes()).padStart(2, '0');
      return `${y}/${m}/${d} ${hh}:${mm}`;
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    let toastTimer = null;
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2800);
    }
  </script>
</body>
