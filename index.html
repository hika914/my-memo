<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひとりごと帳</title>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --card-bg: #ffffff;
            --text-color: #2c2c2c;
            --text-secondary: #777777;
            --border-color: #e5e5e5;
            --accent-color: #555555;
            --danger-color: #d9534f;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #888888;
            --border-color: #2a2a2a;
            --accent-color: #aaaaaa;
            --danger-color: #f4212e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.2s, color 0.2s;
        }

        .container {
            width: 100%;
            max-width: 600px;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        header {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 14px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            transition: 0.2s;
        }

        .tab.active {
            color: var(--text-color);
            border-bottom: 2px solid var(--text-color);
            font-weight: bold;
        }

        .view-section {
            display: none;
            flex: 1;
            padding-bottom: 60px;
        }

        .view-section.active {
            display: block;
        }

        /* 投稿フォーム */
        .post-box {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .replying-indicator {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .replying-indicator button {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 12px;
        }

        .post-box-inner {
            display: flex;
            gap: 12px;
        }

        .avatar-preview {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--border-color);
            object-fit: cover;
            flex-shrink: 0;
        }

        .post-input-area {
            flex: 1;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 15px;
            resize: none;
            outline: none;
            min-height: 70px;
        }

        textarea::placeholder {
            color: var(--text-secondary);
        }

        /* 引用プレビュー */
        .quote-preview-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--text-secondary);
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 13px;
            position: relative;
            color: var(--text-secondary);
            border-radius: 4px;
        }

        .cancel-quote {
            position: absolute;
            top: 5px;
            right: 8px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
        }

        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
        }

        .file-upload-label {
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 18px;
            transition: 0.2s;
        }

        .file-upload-label:hover {
            color: var(--text-color);
        }

        input[type="file"] {
            display: none;
        }

        button.submit-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        button.submit-btn:hover {
            opacity: 0.8;
        }

        /* サムネイル */
        .preview-thumbnails {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .thumb-wrap {
            position: relative;
            width: 50px;
            height: 50px;
        }

        .thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        .thumb-remove {
            position: absolute;
            top: -4px;
            right: -4px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 9px;
            cursor: pointer;
        }

        /* 投稿カード */
        .post-card {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        .post-content-area {
            flex: 1;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .user-info {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .display-name {
            font-weight: bold;
            font-size: 14px;
        }

        .post-date {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            color: var(--danger-color);
        }

        .post-text {
            font-size: 14px;
            line-height: 1.6;
            word-break: break-all;
            white-space: pre-wrap;
            margin-bottom: 8px;
        }

        .post-text a {
            color: var(--text-color);
            text-decoration: underline;
        }

        /* 引用カード */
        .quoted-post {
            border: 1px solid var(--border-color);
            border-left: 2px solid var(--text-secondary);
            padding: 8px 10px;
            margin: 6px 0 8px 0;
            background: var(--card-bg);
            border-radius: 4px;
        }

        /* 画像グリッド */
        .image-grid {
            display: grid;
            gap: 4px;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
            max-height: 280px;
        }

        .image-grid.count-1 { grid-template-columns: 1fr; }
        .image-grid.count-2 { grid-template-columns: 1fr 1fr; }
        .image-grid.count-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .image-grid.count-3 img:first-child { grid-row: span 2; }
        .image-grid.count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

        .image-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            max-height: 220px;
            cursor: pointer;
        }

        .youtube-embed {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            margin-top: 8px;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
        }

        .youtube-embed iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        .post-footer-actions {
            display: flex;
            gap: 15px;
            margin-top: 6px;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .action-item {
            cursor: pointer;
            transition: 0.2s;
        }

        .action-item:hover { color: var(--text-color); }

        /* アカウント・設定画面 */
        .settings-container {
            padding: 20px;
        }

        .settings-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .settings-section h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .input-group input[type="text"] {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            background: var(--card-bg);
            color: var(--text-color);
            transition: 0.2s;
        }

        .btn:hover { opacity: 0.8; }
        .btn-danger { color: var(--danger-color); }

        .storage-meter-bar {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;
        }

        .storage-meter-fill {
            height: 100%;
            background: var(--text-secondary);
            width: 0%;
        }

        .storage-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .empty-msg {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
            font-size: 13px;
        }

        /* 閲覧モード中のバナー */
        #viewerBanner {
            display: none;
            background: #d9534f;
            color: #fff;
            text-align: center;
            padding: 8px;
            font-size: 13px;
            position: sticky;
            top: 45px;
            z-index: 99;
        }
        #viewerBanner button {
            background: #fff;
            color: #d9534f;
            border: none;
            padding: 2px 8px;
            border-radius: 3px;
            margin-left: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #imageModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #imageModal img {
            max-width: 90%; max-height: 90%; object-fit: contain;
        }
    </style>
</head>
<body data-theme="dark">

<div class="container">
    <header>
        <div class="tab active" onclick="switchTab('home')">タイムライン</div>
        <div class="tab" onclick="switchTab('account')">設定・管理</div>
    </header>

    <div id="viewerBanner">
        <span>📂 過去ログ閲覧モード中</span>
        <button onclick="exitViewerMode()">現役に戻る</button>
    </div>

    <div id="homeView" class="view-section active">
        <div class="post-box" id="postBoxArea">
            <div id="replyIndicator" class="replying-indicator" style="display: none;">
                <span id="replyingText">返信中...</span>
                <button onclick="cancelReply()">キャンセル</button>
            </div>
            
            <div id="quotePreviewContainer" style="display: none;" class="quote-preview-box">
                <div style="font-size: 11px; margin-bottom: 2px; color: var(--text-secondary);">引用するひとりごと</div>
                <div id="quotePreviewText" style="overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;"></div>
                <button class="cancel-quote" onclick="cancelQuote()">×</button>
            </div>

            <div class="post-box-inner">
                <img id="formAvatar" src="" class="avatar-preview" alt="icon">
                <div class="post-input-area">
                    <textarea id="postContent" placeholder="いま何を考えている？…"></textarea>
                    
                    <div id="imageThumbnails" class="preview-thumbnails"></div>

                    <div class="post-actions">
                        <label class="file-upload-label" title="画像添付">
                            📷
                            <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageSelect(event)">
                        </label>
                        <button class="submit-btn" onclick="createPost()">投稿する</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="timeline"></div>
    </div>

    <div id="accountView" class="view-section">
        <div class="settings-container">
            <div class="settings-section">
                <h3>テーマ設定</h3>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" onclick="setTheme('dark')">🌙 ダークモード</button>
                    <button class="btn" onclick="setTheme('light')">☀️ ライトモード</button>
                </div>
            </div>

            <div class="settings-section">
                <h3>プロフィール</h3>
                <div class="input-group">
                    <label>表示名</label>
                    <input type="text" id="settingName" placeholder="名前">
                </div>
                <div class="input-group">
                    <label>アイコン</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <img id="settingAvatarPreview" class="avatar-preview" src="">
                        <input type="file" id="avatarInput" accept="image/*" onchange="handleAvatarSelect(event)">
                        <button class="btn" onclick="document.getElementById('avatarInput').click()">変更</button>
                        <button class="btn btn-danger" onclick="resetAvatar()">初期に戻す</button>
                    </div>
                </div>
                <button class="btn" onclick="saveProfile()" style="margin-top: 5px;">保存</button>
            </div>

            <div class="settings-section">
                <h3>データ管理・容量</h3>
                <div class="storage-info">
                    <span>使用量</span>
                    <span id="storageText">0 KB / 約 5 MB</span>
                </div>
                <div class="storage-meter-bar">
                    <div id="storageFill" class="storage-meter-fill"></div>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 15px;">
                    <button class="btn" onclick="exportData()">① 通常のバックアップ保存</button>
                    <button class="btn btn-danger" onclick="archiveAndReset()">② アーカイブして整理（保存＋投稿リセット）</button>
                    <button class="btn" onclick="document.getElementById('importFile').click()">③ 思い出を見る（過去ログ読込）</button>
                    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importViewerData(event)">
                </div>
            </div>
        </div>
    </div>
</div>

<div id="imageModal" onclick="closeModal()">
    <img id="modalImg" src="">
</div>

<script>
    let posts = JSON.parse(localStorage.getItem('private_posts') || '[]');
    let profile = JSON.parse(localStorage.getItem('private_profile') || JSON.stringify({
        name: '自分',
        avatar: '',
        theme: 'dark'
    }));

    let viewingPosts = null; // 閲覧モード用の過去ログデータ
    let selectedImages = [];
    let replyingToId = null;
    let quotingPostId = null;

    window.onload = function() {
        setTheme(profile.theme || 'dark');
        updateProfileUI();
        renderTimeline();
        updateStorageMeter();
    };

    function setTheme(theme) {
        profile.theme = theme;
        document.body.setAttribute('data-theme', theme);
        localStorage.setItem('private_profile', JSON.stringify(profile));
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));

        if (tabName === 'home') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('homeView').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('accountView').classList.add('active');
            document.getElementById('settingName').value = profile.name;
            document.getElementById('settingAvatarPreview').src = profile.avatar || getDefaultAvatar();
        }
    }

    function getDefaultAvatar() {
        return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="%23888"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>';
    }

    function updateProfileUI() {
        document.getElementById('formAvatar').src = profile.avatar || getDefaultAvatar();
    }

    function compressImage(file, maxWidth = 800, quality = 0.7) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                }
            }
        });
    }

    async function handleImageSelect(event) {
        const files = event.target.files;
        if (!files) return;

        for (let file of files) {
            if (selectedImages.length >= 4) {
                alert('画像は一度に最大4枚まで添付できます。');
                break;
            }
            const compressed = await compressImage(file);
            selectedImages.push(compressed);
        }
        event.target.value = '';
        renderThumbnails();
    }

    function renderThumbnails() {
        const container = document.getElementById('imageThumbnails');
        container.innerHTML = '';
        selectedImages.forEach((imgSrc, index) => {
            const wrap = document.createElement('div');
            wrap.className = 'thumb-wrap';
            wrap.innerHTML = `
                <img src="${imgSrc}">
                <button class="thumb-remove" onclick="removeImage(${index})">×</button>
            `;
            container.appendChild(wrap);
        });
    }

    function removeImage(index) {
        selectedImages.splice(index, 1);
        renderThumbnails();
    }

    async function handleAvatarSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        const compressed = await compressImage(file, 200, 0.8);
        profile.avatar = compressed;
        document.getElementById('settingAvatarPreview').src = profile.avatar;
    }

    function resetAvatar() {
        profile.avatar = '';
        document.getElementById('settingAvatarPreview').src = getDefaultAvatar();
    }

    function saveProfile() {
        const nameInput = document.getElementById('settingName').value.trim();
        if (nameInput) profile.name = nameInput;
        localStorage.setItem('private_profile', JSON.stringify(profile));
        updateProfileUI();
        renderTimeline();
        alert('保存しました');
    }

    function createPost() {
        if (viewingPosts) {
            alert('現在は「思い出を見る（過去ログ閲覧モード）」中です。現役に戻ってから投稿してください。');
            return;
        }
        const content = document.getElementById('postContent').value.trim();
        if (!content && selectedImages.length === 0) return;

        const newPost = {
            id: Date.now(),
            content: content,
            images: [...selectedImages],
            quoteId: quotingPostId,
            replyTo: replyingToId,
            createdAt: new Date().toISOString()
        };
        posts.unshift(newPost);
        saveAndResetForm();
    }

    function saveAndResetForm() {
        localStorage.setItem('private_posts', JSON.stringify(posts));
        document.getElementById('postContent').value = '';
        selectedImages = [];
        renderThumbnails();
        cancelReply();
        cancelQuote();
        renderTimeline();
        updateStorageMeter();
    }

    function deletePost(id) {
        if (viewingPosts) return;
        if (!confirm('この投稿を削除しますか？')) return;
        posts = posts.filter(p => p.id !== id);
        localStorage.setItem('private_posts', JSON.stringify(posts));
        renderTimeline();
        updateStorageMeter();
    }

    function setReplyTo(id) {
        if (viewingPosts) return;
        replyingToId = id;
        const target = (viewingPosts || posts).find(p => p.id === id);
        document.getElementById('replyIndicator').style.display = 'flex';
        document.getElementById('replyingText').innerText = `返信先: "${(target.content || '[画像]').substring(0, 15)}..."`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelReply() {
        replyingToId = null;
        document.getElementById('replyIndicator').style.display = 'none';
    }

    function setQuote(id) {
        if (viewingPosts) return;
        quotingPostId = id;
        const target = (viewingPosts || posts).find(p => p.id === id);
        document.getElementById('quotePreviewContainer').style.display = 'block';
        
        // 引用プレビュー時のスマート化（本文なしならサムネイル表示）
        if (target.content) {
            document.getElementById('quotePreviewText').innerText = target.content;
        } else if (target.images && target.images.length > 0) {
            document.getElementById('quotePreviewText').innerHTML = `<img src="${target.images[0]}" style="width: 30px; height: 30px; object-fit: cover; border-radius: 3px; vertical-align: middle;"> 画像付きのひとりごと`;
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelQuote() {
        quotingPostId = null;
        document.getElementById('quotePreviewContainer').style.display = 'none';
    }

    function formatContent(text) {
        if (!text) return '';
        let escaped = text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

        const urlRegex = /(https?:\/\/[^\s]+)/g;
        return escaped.replace(urlRegex, function(url) {
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1].split('&')[0];
                } else if (url.includes('shorts/')) {
                    videoId = url.split('shorts/')[1].split('?')[0];
                }
                if (videoId) {
                    return `<div class="youtube-embed"><iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe></div>`;
                }
            }
            return `<a href="${url}" target="_blank">${url}</a>`;
        });
    }

    function renderTimeline() {
        const timeline = document.getElementById('timeline');
        timeline.innerHTML = '';

        const targetPosts = viewingPosts || posts;

        if (targetPosts.length === 0) {
            timeline.innerHTML = '<div class="empty-msg">まだ何も書いていません</div>';
            return;
        }

        targetPosts.forEach((post) => {
            const card = document.createElement('div');
            card.className = 'post-card';

            const avatar = profile.avatar || getDefaultAvatar();
            const dateStr = new Date(post.createdAt).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

            let imagesHtml = '';
            if (post.images && post.images.length > 0) {
                const countClass = `count-${post.images.length}`;
                let imgs = post.images.map(src => `<img src="${src}" onclick="openModal('${src}')">`).join('');
                imagesHtml = `<div class="image-grid ${countClass}">${imgs}</div>`;
            }

            let quoteHtml = '';
            if (post.quoteId) {
                const quoted = targetPosts.find(p => p.id === post.quoteId);
                if (quoted) {
                    let quotedInner = '';
                    if (quoted.content) {
                        quotedInner = `<div style="font-size: 13px; word-break: break-all; white-space: pre-wrap;">${quoted.content}</div>`;
                    }
                    if (quoted.images && quoted.images.length > 0) {
                        quotedInner += `<div style="margin-top: 4px;"><img src="${quoted.images[0]}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px;"></div>`;
                    }
                    quoteHtml = `
                        <div class="quoted-post">
                            <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 2px;">${profile.name}</div>
                            ${quotedInner}
                        </div>
                    `;
                }
            }

            const deleteBtnHtml = viewingPosts ? '' : `<button class="delete-btn" onclick="deletePost(${post.id})">削除</button>`;
            const actionsHtml = viewingPosts ? '' : `
                <div class="post-footer-actions">
                    <span class="action-item" onclick="setReplyTo(${post.id})">返信</span>
                    <span class="action-item" onclick="setQuote(${post.id})">引用</span>
                </div>
            `;

            card.innerHTML = `
                <img src="${avatar}" class="avatar-preview" alt="icon">
                <div class="post-content-area">
                    <div class="post-header">
                        <div class="user-info">
                            <span class="display-name">${profile.name}</span>
                            <span class="post-date">${dateStr}</span>
                        </div>
                        ${deleteBtnHtml}
                    </div>
                    <div class="post-text">${formatContent(post.content)}</div>
                    ${imagesHtml}
                    ${quoteHtml}
                    ${actionsHtml}
                </div>
            `;
            timeline.appendChild(card);
        });
    }

    function updateStorageMeter() {
        const dataStr = (localStorage.getItem('private_posts') || '') + (localStorage.getItem('private_profile') || '');
        const bytes = new Blob([dataStr]).size;
        const kb = (bytes / 1024).toFixed(1);
        const percent = Math.min((kb / 5120) * 100, 100);
        document.getElementById('storageText').innerText = `${kb} KB / 約 5 MB`;
        document.getElementById('storageFill').style.width = `${percent}%`;
    }

    function exportData() {
        const data = { posts: posts, profile: profile };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `hitorigoto-backup-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    // アーカイブして整理（保存してから投稿のみクリア）
    function archiveAndReset() {
        if (!confirm('現在の全データをバックアップ保存したあと、タイムラインの投稿のみをリセット（空に）しますか？\n（※アカウントの名前やアイコンはそのまま保持されます）')) return;
        
        // 1. 自動バックアップ保存
        exportData();

        // 2. 投稿のみクリア
        posts = [];
        localStorage.setItem('private_posts', JSON.stringify(posts));
        renderTimeline();
        updateStorageMeter();
        alert('バックアップを保存し、タイムラインを綺麗にリセットしました！');
    }

    // 思い出を見る（閲覧専用ビューワー読込）
    function importViewerData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.posts) {
                    viewingPosts = data.posts;
                    document.getElementById('viewerBanner').style.display = 'block';
                    document.getElementById('postBoxArea').style.display = 'none'; // 閲覧中は投稿フォームを隠す
                    renderTimeline();
                    switchTab('home');
                    alert('過去ログを読み込みました（思い出閲覧モード）');
                } else {
                    alert('ファイルの形式が正しくありません。');
                }
            } catch (err) {
                alert('読み込みに失敗しました。');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function exitViewerMode() {
        viewingPosts = null;
        document.getElementById('viewerBanner').style.display = 'none';
        document.getElementById('postBoxArea').style.display = 'block';
        renderTimeline();
        alert('現役のタイムラインに戻りました');
    }

    function openModal(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('imageModal').style.display = 'flex';
    }
    function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
    }
</script>

</body>
</html>
